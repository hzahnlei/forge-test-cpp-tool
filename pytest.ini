[pytest]
# @no_step_definition marks a Gherkin scenario (or a single step) that has no automated pytest-bdd
# step binding by design — e.g. behavior a host-side subprocess harness cannot represent (real
# elapsed wall-clock time), or a code path structurally unreachable through the interfaces this
# test tier drives (an ISR-only hook, for instance). It does not mean "untested": verification may
# still happen at another tier. Document the specific reason next to the scenario, or in
# test/bdd/README.md.
#
# @integrative marks a scenario that needs real infrastructure; it runs apart from `make bdd-test`.
#
# @wip marks a scenario that is a requirement not implemented yet.
markers =
    no_step_definition: scenario or step intentionally has no step implementation (see above)
    integrative: scenario needs real infrastructure and runs apart from bdd-test
    wip: scenario is a requirement not implemented yet
addopts = -m "not no_step_definition and not integrative and not wip"
bdd_features_base_dir = docs/verification/acceptance
