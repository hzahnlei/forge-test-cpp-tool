name: Improvement
description: Propose an improvement.
title: "[Improvement] "
labels:
  - improvement
body:
  - type: textarea
    id: contacts
    attributes:
      label: Contacts
      description: Name persons/organizations who raised the improvement, can provide input, or provide support.
      value: |
        | Person/Organization | Contribution |
        | -------------------- | ------------- |
        |                      |               |
  - type: textarea
    id: current-situation
    attributes:
      label: Current Situation
      description: Describe how the current implementation, process, or behavior works and where it falls short.
    validations:
      required: true
  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed Improvement
      description: Describe the concrete change you propose.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Benefit
      description: Describe why this improvement matters (e.g. performance, maintainability, usability, cost, reduced technical debt).
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Describe when the solution is considered done. Mandatory. Part of the Definition of Ready.
      value: |
        1.
        2. ...
    validations:
      required: true
  - type: textarea
    id: references-and-attachments
    attributes:
      label: References and Attachments
      description: Add links to related documents and tickets. Attach screen shots and diagrams.
